services:
  rabbitmq:
    image: rabbitmq:4-management
    container_name: delivery-rabbitmq
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # management console (guest / guest)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
