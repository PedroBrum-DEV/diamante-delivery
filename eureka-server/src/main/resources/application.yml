server:
  port: 8761

spring:
  application:
    name: eureka-server

eureka:
  client:
    # The server does not register with itself nor fetch the registry.
    register-with-eureka: false
    fetch-registry: false
  server:
    # Development convenience: stopped instances leave the registry quickly.
    enable-self-preservation: false
    eviction-interval-timer-in-ms: 5000
